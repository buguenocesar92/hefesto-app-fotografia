# ---------------------------------------------------------------------------
# Gestión de Fotografía: entorno de PRODUCCIÓN
# ---------------------------------------------------------------------------
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
#
# DIFERENCIAS CON DESARROLLO QUE IMPORTAN
# ---------------------------------------
#  1. SOLO Caddy publica puertos (80 y 443). La API, la web, PostgreSQL, Redis y
#     Authentik no son accesibles desde la red: solo se hablan entre ellos por la
#     red interna de Docker.
#  2. El código va DENTRO de la imagen. No hay volumen con el código: si el host
#     se compromete, el atacante no gana acceso al código fuente.
#  3. Los secretos vienen del `.env.prod`, que no se versiona.
#  4. Los servicios tienen límite de reinicio y de registros.
#
# LO QUE ESTE ARCHIVO NO HACE
# ---------------------------
#  - No respalda la base de datos. Ver docs/08.
#  - No aplica migraciones en cada arranque: se aplican una vez, a mano. Un
#    despliegue que cambia el esquema sin que nadie lo decida es un despliegue que
#    puede cortar el servicio.
#
# ---------------------------------------------------------------------------

name: fotografia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Caddy: el único puerto abierto del sistema.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en el .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en el .env.prod}
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # -------------------------------------------------------------------------
  # API.
  # -------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Fotografía Hefesto"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el .env.prod}
      APP_URL: ${APP_URL:?falta APP_URL en el .env.prod}
      APP_WEB_URL: ${APP_WEB_URL:?falta APP_WEB_URL en el .env.prod}
      # En producción la cookie de sesión DEBE ir por HTTPS.
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_DRIVER: database

      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_STACK: daily
      LOG_DAILY_DAYS: "30"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fotografia}
      # Rol de la aplicación. NO superusuario y SIN BYPASSRLS: es lo que hace que
      # las políticas de Row Level Security se apliquen de verdad. Ver la nota de
      # PostgreSQL más abajo.
      DB_USERNAME: ${DB_USERNAME:-fotografia_app}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
      DB_SSLMODE: prefer

      # La conexión de auditoría: aparte a propósito, porque la petición a la que
      # se le deniega el acceso a un original termina revertida y el registro del
      # intento tiene que sobrevivir a esa reversa. Ver docs/07.
      DB_AUDITORIA_HOST: postgres
      DB_AUDITORIA_PORT: 5432
      DB_AUDITORIA_DATABASE: ${DB_DATABASE:-fotografia}
      DB_AUDITORIA_USERNAME: ${DB_USERNAME:-fotografia_app}
      DB_AUDITORIA_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
      DB_AUDITORIA_SSLMODE: prefer

      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el .env.prod}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el .env.prod}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el .env.prod}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el .env.prod}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
      AUTHENTIK_ALGORITMO: ${AUTHENTIK_ALGORITMO:-RS256}

      # Agenda. Son límites técnicos del widget de fechas, no promesas.
      FOTOGRAFIA_DURACION_MAXIMA_MINUTOS: ${FOTOGRAFIA_DURACION_MAXIMA_MINUTOS:-600}
      FOTOGRAFIA_ANTICIPACION_MAXIMA_DIAS: ${FOTOGRAFIA_ANTICIPACION_MAXIMA_DIAS:-540}
      FOTOGRAFIA_ANTICIPACION_MINIMA_DIAS: ${FOTOGRAFIA_ANTICIPACION_MINIMA_DIAS:-0}

      # ESTOS TRES NACEN VACÍOS Y ES DELIBERADO.
      # El plazo de entrega, el de laboratorio y el de selección son promesas
      # comerciales del estudio. Ponerles un valor por omisión sería prometer al
      # cliente una fecha que nadie acordó. Ver docs/05 y docs/06.
      FOTOGRAFIA_DIAS_PROMESA_ENTREGA: ${FOTOGRAFIA_DIAS_PROMESA_ENTREGA:-}
      FOTOGRAFIA_DIAS_PROMESA_LABORATORIO: ${FOTOGRAFIA_DIAS_PROMESA_LABORATORIO:-}
      FOTOGRAFIA_DIAS_PARA_SELECCION: ${FOTOGRAFIA_DIAS_PARA_SELECCION:-}
      FOTOGRAFIA_FORMATOS_IMPRESION: ${FOTOGRAFIA_FORMATOS_IMPRESION:-}

      # Abonos. El cincuenta por ciento es la forma descrita para el rubro, y es
      # la política de la instalación, no un dato legal.
      FOTOGRAFIA_PORCENTAJE_ABONO_INICIAL: ${FOTOGRAFIA_PORCENTAJE_ABONO_INICIAL:-50}
      FOTOGRAFIA_EXIGIR_ABONO_INICIAL: ${FOTOGRAFIA_EXIGIR_ABONO_INICIAL:-true}
      FOTOGRAFIA_PERMITIR_ABONO_PARCIAL: ${FOTOGRAFIA_PERMITIR_ABONO_PARCIAL:-true}

      # Conservación. El plazo máximo sin verificar también nace vacío.
      FOTOGRAFIA_DIAS_ENTRE_VERIFICACIONES: ${FOTOGRAFIA_DIAS_ENTRE_VERIFICACIONES:-30}
      FOTOGRAFIA_DIAS_MAX_SIN_VERIFICAR: ${FOTOGRAFIA_DIAS_MAX_SIN_VERIFICAR:-}
      FOTOGRAFIA_RETENCION_ACCESOS_ARCHIVO_DIAS: ${FOTOGRAFIA_RETENCION_ACCESOS_ARCHIVO_DIAS:-}
      FOTOGRAFIA_AVISAR_ANTES_DE_PURGAR: "false"

      # Las migraciones NO se corren en cada arranque de este servicio.
      FOTOGRAFIA_CORRER_MIGRACIONES: "false"
    volumes:
      - storage-temporal:/var/www/html/storage/framework
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8000/api/v1/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # -------------------------------------------------------------------------
  # Planificador y trabajador de colas: misma imagen, otro comando.
  #
  # Es el único proceso que revisa los medios con originales y las sesiones que
  # esperan selección. Si este contenedor se cae, el estudio sigue atendiendo, pero
  # nadie se entera de que un disco dejó de responder. Por eso tiene su propio
  # reinicio y su propio límite.
  # -------------------------------------------------------------------------
  cola:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command:
      ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fotografia}
      DB_USERNAME: ${DB_USERNAME:-fotografia_app}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
    volumes:
      - storage-temporal:/var/www/html/storage/framework
    logging: *logging

  # -------------------------------------------------------------------------
  # Interfaz.
  # -------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:?falta WEB_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8000
      NUXT_PUBLIC_BASE: ${APP_WEB_URL}
    logging: *logging

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # Sin puerto publicado: la base no es accesible desde afuera del host, ni
  # siquiera desde la red local. Para entrar hay que usar un túnel SSH.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo se usa
  # para crear la base y para las tareas administrativas. La aplicación NUNCA
  # conecta con él.
  #
  # El rol de la aplicación (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explícitos. Le da la propiedad de la base para que
  # las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUÉ IMPORTA, Y EN UN ESTUDIO MÁS QUE EN OTRO: la documentación de
  # PostgreSQL 18 dice que los superusuarios "always bypass the row security
  # system", y que `FORCE ROW LEVEL SECURITY` sujeta solo al DUEÑO de la tabla,
  # no al superusuario. Con un solo rol, las políticas de RLS no se aplicarían
  # NUNCA y el aislamiento entre estudios sería decorativo: `accesos_archivo`, que
  # registra quién abrió los originales de las fotos de qué sesión, sería legible
  # entre estudios, y `contratos`, con lo que cada cliente pagó y debe, también.
  # Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fotografia}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-fotografia_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env.prod}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Rol con el que conecta la aplicación. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-fotografia_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fotografia_app} -d ${DB_DATABASE:-fotografia}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en el .env.prod}"]
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # -------------------------------------------------------------------------
  # Authentik 2025.10: `server` + `worker` con la misma imagen, y su propia base
  # de datos. Sin Redis (Authentik lo eliminó en 2025.10).
  #
  # La interfaz de administración de Authentik NO se publica. Para entrar hay que
  # usar un túnel SSH hasta el puerto 9000 del contenedor:
  #
  #   docker compose exec -it authentik-server ak shell
  #   ssh -L 9000:localhost:9000 usuario@servidor
  # -------------------------------------------------------------------------
  authentik-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?falta AUTHENTIK_SECRET_KEY en el .env.prod}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-media:/media
    logging: *logging

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-media:/media
    logging: *logging

volumes:
  postgres-datos:
  redis-datos:
  authentik-postgres-datos:
  authentik-media:
  storage-temporal:
  caddy-datos:
  caddy-config: