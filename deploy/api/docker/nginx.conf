# =============================================================================
; nginx de Fotografía
; =============================================================================
; Sirve `/var/www/html/public` y manda PHP a php-fpm por socket.
;
; Notamos dos cosas, y las dos importan en un estudio:
;
;   - `server_tokens off`: no anuncia la versión de nginx.
;   - `Cache-Control: no-store` en TODA respuesta: ni una agenda, ni una ficha de
;     cliente ni una galería pueden quedar en el historial del navegador ni en un
;     proxy intermedio. En un estudio el equipo se turna en el mismo puesto, y el
;     historial del navegador lo ve el siguiente.
;
; Las cabeceras de endurecimiento se agregan acá y también en Caddy. No es
; redundancia inútil: cada capa que responde, responde con sus propias reglas.
; =============================================================================

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
        # Con `POST` grande no debería pasar nada: la aplicación no sube
        # fotografías. El límite está en `client_max_body_size` y en
        # `file_uploads = Off` de php.ini.
        fastcgi_param HTTP_PROXY "";
    }

    # Nadie debería pedir un archivo que no sea de `public`.
    location ~ /\. {
        deny all;
    }

    # La carpeta de Laravel no se sirve nunca. Esta regla es la segunda línea
    # después de `root`: aun si algo la cambiara, sigue sin servirse.
    location ~ ^/(app|config|database|storage|tests|herramientas)/ {
        deny all;
    }
}