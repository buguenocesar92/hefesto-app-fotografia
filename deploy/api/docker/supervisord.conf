; =============================================================================
; supervisord de Fotografía
; =============================================================================
; Tres procesos: php-fpm (la API), el worker de colas y el planificador de
; tareas. Si el worker de colas no corre, las revisiones de conservación de los
; medios con originales y los avisos de selección pendiente quedan apilados, y en
; un estudio eso significa que nadie se entera de que un disco dejó de responder.
;
; NGINX NO ESTÁ ACÁ, A PROPÓSITO
; ------------------------------
; El `CMD` de la imagen es `supervisord`. Si nginx fuera un cuarto programa aquí,
; habría dos supervisores compitiendo por el mismo archivo de pid y el arranque se
; volvería inestable. En esta aplicación el contenedor de la API no publica puertos
; y Caddy no le manda tráfico HTTP de usuarios, así que nginx queda como proceso
; interno de php-fpm y lo lanza la imagen base.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cola]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; El worker tiene que morir y volver para no arrastrar el contexto de una petición
; a la siguiente. Es especialmente importante acá: si arrastrara el
; `app.tenant_id` de una transacción, una tarea leería datos de otro estudio.
; Ver docs/03.
stopasgroup=true
killasgroup=true

[program:planificador]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0