; =============================================================================
; Configuración de PHP de Fotografía
; =============================================================================

; Registro: los errores no se muestran al navegador. En una aplicación donde las
; fichas son de personas y las fotos son de familias, una excepción en pantalla
; puede incluir contenido de una petición.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Registro PHP duplicado por el de Laravel: se deja el de PHP apuntando a
; stderr para no perder los avisos del motor.
memory_limit = 256M
max_execution_time = 30

; ESTA APLICACIÓN NO SUBE FOTOGRAFÍAS POR LA INTERFAZ, Y POR ESO ESTÁ APAGADO.
;
; Un estudio entrega las fotos «de por vida», pero eso NO significa que tenga que
; subirlas por el navegador: los originales van al medio de conservación que se
; declara en `conservaciones`, que es un disco o una red, y no un formulario.
;
; Con la subida apagada no se abre la puerta a que un `.output` de varios
; gigabytes empiece a pasar por HTTP sin que nadie lo haya decidido. La lectura de
; originales tampoco está implementada todavía; ver `FotoArchivoController` y
; docs/08.
file_uploads = Off
upload_max_filesize = 4M
post_max_size = 4M

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; `validate_timestamps = 0` obliga a reiniciar el contenedor en cada despliegue.
; Es lo correcto en producción; el compose de desarrollo lo sobrescribe con este
; último comentario.
opcache.validate_timestamps = 0

date.timezone = UTC

session.cookie_httponly = 1
; La cookie de sesión no viaja por JavaScript: con CSRF aparte, el robo de cookie
; deja de ser utilizable desde el navegador.
session.cookie_samesite = "Lax"